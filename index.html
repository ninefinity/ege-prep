<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ЕГЭ Prep – Yap O'Clock</title>
  <link rel="icon" href="assets/clocklogo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="index.css" />
</head>
<body class="yap-brand">
  <main class="ege-page">
    <header class="ege-topbar">
      <div class="ege-topbar__row">
        <div class="ege-topbar__left">
          <div class="ege-header">
            <h1 class="ege-header__title">
              <img class="ege-brand-mark" src="assets/clocklogo.png" alt="" width="44" height="44" aria-hidden="true" />
              <span id="egeCatalogTitle">ЕГЭ Prep</span>
            </h1>
            <p class="ege-lede" id="egeCatalogSubtitle">Practice by task type.</p>
          </div>
        </div>
      </div>
    </header>

    <div class="ege-catalog" id="egeCatalog" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var catalog = document.getElementById("egeCatalog");

      fetch("sections.json")
        .then(function (res) {
          return res.json();
        })
        .then(function (data) {
          if (data.title) {
            document.getElementById("egeCatalogTitle").textContent = data.title;
          }
          if (data.subtitle) {
            document.getElementById("egeCatalogSubtitle").textContent = data.subtitle;
          }

          if (!data.sections || !data.sections.length) {
            catalog.innerHTML = '<p class="ege-empty">No sections yet.</p>';
            return;
          }

          data.sections.forEach(function (section) {
            var link = document.createElement("a");
            link.className = "ege-topic-card";
            link.href = "topic.html?t=" + encodeURIComponent(section.id);
            link.setAttribute("aria-label", "Open section: " + section.title);

            var badge = section.badge || "";
            var title = section.title || "";
            var badgeNorm = badge.toLowerCase().replace(/\s+/g, " ").trim();
            var titleNorm = title.toLowerCase().replace(/\s+/g, " ").trim();
            var showBadge =
              badgeNorm &&
              titleNorm !== badgeNorm &&
              titleNorm.indexOf(badgeNorm) !== 0;

            link.innerHTML =
              (showBadge
                ? '<div class="ege-topic-card__badges"><span class="ege-topic-card__badge">' +
                  badge +
                  "</span></div>"
                : "") +
              '<h2 class="ege-topic-card__title">' +
              title +
              "</h2>" +
              (section.subtitle
                ? '<p class="ege-topic-card__subtitle">' + section.subtitle + "</p>"
                : "") +
              '<span class="ege-topic-card__cta">Start →</span>';

            catalog.appendChild(link);
          });
        })
        .catch(function () {
          catalog.innerHTML = '<p class="ege-empty">Could not load sections.</p>';
        });
    })();
  </script>
  <script src="shared/site-footer.js"></script>
</body>
</html>
