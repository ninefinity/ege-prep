<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time to ЕГЭ – Yap O'Clock</title>
  <link rel="icon" href="assets/timetoege.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shell.css" />
</head>
<body class="yap-brand">
  <main class="ege-page" id="egePage">
    <div class="ege-topics">
      <aside class="ege-rail">
        <div class="ege-topic-sidebar" id="egeTopicSidebar">
          <div class="ege-topic-sidebar__head">
            <a href="index.html" class="ege-back ege-topic-sidebar__back">← Sections</a>
            <div class="ege-topic-sidebar__logo">
              <img class="ege-rail__mark" src="assets/timetoege.png" alt="" aria-hidden="true" />
            </div>
          </div>
          <div class="ege-topic-nav" id="egeTopicNav">
            <nav class="ege-nav" id="egeNav" aria-label="Tasks"></nav>
          </div>
        </div>
      </aside>
    </div>

    <div class="ege-workspace">
      <div id="egeListeningChrome" aria-hidden="true"></div>
      <p class="ege-instructions" id="egeInstructions" hidden></p>
      <div id="egePanels" aria-live="polite" aria-busy="true">
        <p class="ege-loading" id="egeTopicLoading">Loading…</p>
      </div>
      <nav class="ege-task-flow" id="egeTaskFlow" aria-label="Task navigation" hidden>
        <button type="button" class="ege-task-flow__btn" id="egeFlowPrev" aria-label="Previous task" hidden>‹</button>
        <button type="button" class="ege-task-flow__current" id="egeFlowCurrent" aria-expanded="false" aria-controls="egeNav">
          <span class="ege-task-flow__position" id="egeFlowPosition"></span>
          <span class="ege-task-flow__label" id="egeFlowLabel"></span>
        </button>
        <button type="button" class="ege-task-flow__btn" id="egeFlowNext" aria-label="Next task" hidden>›</button>
      </nav>
    </div>
  </main>

  <script src="js/highlight.js"></script>
  <script type="module">
    var params = new URLSearchParams(location.search);
    var variant = params.get("variant") || "";
    var task = params.get("task") || "";
    if (variant.indexOf("2027") === 0 || task.indexOf("demo2027-") === 0) {
      location.replace("2027/topic.html" + location.search);
    } else {
      import("./js/engine.js").then(function () {
        EgePrep.initTopicPage();
      });
    }
  </script>
  <script src="shared/site-footer.js"></script>
</body>
</html>
