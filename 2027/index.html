<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time to ЕГЭ — демо 2027</title>
  <meta name="description" content="Интерактивный вариант демо ЕГЭ 2027 по английскому." />
  <meta property="og:title" content="Time to ЕГЭ — демо 2027" />
  <meta property="og:description" content="Интерактивный вариант демо ЕГЭ 2027 по английскому." />
  <meta property="og:image" content="assets/time-to-ege-2027-edition.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#1a0812" />
  <link rel="icon" href="assets/time-to-ege-2027-edition.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/promo.css" />
</head>
<body class="yap-brand yap-promo">
  <main class="ege-page ege-page--promo">
    <header class="ege-promo-header">
      <img class="ege-promo-header__logo" src="assets/time-to-ege-2027-edition.png" alt="Time to ЕГЭ 2027" width="240" height="240" />

      <div class="ege-countdown ege-countdown--hero" id="egeCountdown" aria-live="off">
        <div class="ege-countdown__stage">
          <svg class="ege-countdown__board" viewBox="0 0 780 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="egeCardDark" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#0b072e"/>
                <stop offset="100%" stop-color="#00003b"/>
              </linearGradient>
              <linearGradient id="egeCardShine" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#eef0fa" stop-opacity="0.10"/>
                <stop offset="50%" stop-color="#eef0fa" stop-opacity="0"/>
              </linearGradient>
              <filter id="egeCardShadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00003b" flood-opacity="0.4"/>
              </filter>
              <g id="egeCardFace">
                <rect width="64" height="100" rx="9" fill="url(#egeCardDark)" filter="url(#egeCardShadow)"/>
                <rect width="64" height="50" rx="9" fill="url(#egeCardDark)"/>
                <rect y="48" width="64" height="4" fill="#00003b" opacity="0.7"/>
                <rect width="64" height="50" rx="9" fill="url(#egeCardShine)"/>
                <circle cx="7" cy="50" r="2.6" fill="#6a69a5"/>
                <circle cx="57" cy="50" r="2.6" fill="#6a69a5"/>
              </g>
            </defs>

            <g transform="translate(20,8)">
              <use href="#egeCardFace"/>
              <text id="egeCdD0" class="ege-countdown__digit" x="32" y="69" text-anchor="middle">0</text>
              <text class="ege-countdown__label" x="106" y="128" text-anchor="middle">DAYS</text>
            </g>
            <g transform="translate(90,8)">
              <use href="#egeCardFace"/>
              <text id="egeCdD1" class="ege-countdown__digit" x="32" y="69" text-anchor="middle">0</text>
            </g>
            <g transform="translate(160,8)">
              <use href="#egeCardFace"/>
              <text id="egeCdD2" class="ege-countdown__digit" x="32" y="69" text-anchor="middle">0</text>
            </g>

            <text class="ege-countdown__colon" x="248" y="72">:</text>

            <g transform="translate(268,8)">
              <use href="#egeCardFace"/>
              <text id="egeCdH0" class="ege-countdown__digit" x="32" y="69" text-anchor="middle">0</text>
              <text class="ege-countdown__label" x="102" y="128" text-anchor="middle">HOURS</text>
            </g>
            <g transform="translate(338,8)">
              <use href="#egeCardFace"/>
              <text id="egeCdH1" class="ege-countdown__digit" x="32" y="69" text-anchor="middle">0</text>
            </g>

            <text class="ege-countdown__colon" x="426" y="72">:</text>

            <g transform="translate(446,8)">
              <use href="#egeCardFace"/>
              <text id="egeCdM0" class="ege-countdown__digit" x="32" y="69" text-anchor="middle">0</text>
              <text class="ege-countdown__label" x="102" y="128" text-anchor="middle">MINUTES</text>
            </g>
            <g transform="translate(516,8)">
              <use href="#egeCardFace"/>
              <text id="egeCdM1" class="ege-countdown__digit" x="32" y="69" text-anchor="middle">0</text>
            </g>

            <text class="ege-countdown__colon" x="604" y="72">:</text>

            <g transform="translate(624,8)">
              <use href="#egeCardFace"/>
              <text id="egeCdS0" class="ege-countdown__digit" x="32" y="69" text-anchor="middle">0</text>
              <text class="ege-countdown__label" x="102" y="128" text-anchor="middle">SECONDS</text>
            </g>
            <g transform="translate(694,8)">
              <use href="#egeCardFace"/>
              <text id="egeCdS1" class="ege-countdown__digit" x="32" y="69" text-anchor="middle">0</text>
            </g>
          </svg>
        </div>
      </div>
    </header>

    <div class="ege-promo-start" id="egePromoStart">
      <button type="button" class="ege-promo-cta" id="egePromoStartBtn">Start mock exam</button>
    </div>

    <section class="ege-promo-section ege-promo-section--materials" aria-labelledby="egePromoMaterials">
      <h2 class="ege-promo-section__heading" id="egePromoMaterials">Официальные материалы ФИПИ</h2>
      <ul class="ege-promo-materials">
        <li><a href="%D0%90%D0%AF-11%20%D0%95%D0%93%D0%AD%202027%20%D0%94%D0%95%D0%9C%D0%9E_%D0%9F%D0%A7.pdf" target="_blank" rel="noopener noreferrer">Демоверсия — письменная часть</a></li>
        <li><a href="%D0%90%D0%AF-11%20%D0%95%D0%93%D0%AD%202027%20%D0%94%D0%95%D0%9C%D0%9E_%D0%A3%D0%A7.pdf" target="_blank" rel="noopener noreferrer">Демоверсия — устная часть</a></li>
        <li><a href="%D0%90%D0%AF-11%20%D0%95%D0%93%D0%AD%202027%20%D0%9A%D0%9E%D0%94%D0%98%D0%A4.pdf" target="_blank" rel="noopener noreferrer">Кодификатор</a></li>
        <li><a href="%D0%98%D0%9D%D0%AF%D0%97-11%20%D0%95%D0%93%D0%AD%202027%20%D0%A1%D0%9F%D0%95%D0%A6.pdf" target="_blank" rel="noopener noreferrer">Спецификация</a></li>
      </ul>
    </section>
  </main>

  <div class="ege-promo-gate-overlay" id="egePromoGate" hidden>
    <button type="button" class="ege-promo-gate-backdrop" id="egePromoGateBackdrop" aria-label="Close"></button>
    <div class="ege-promo-gate-panel" role="dialog" aria-modal="true" aria-labelledby="egePromoGateTitle">
      <h2 class="ege-promo-gate-panel__title" id="egePromoGateTitle">Enter code</h2>
      <form class="ege-promo-unlock" id="egePromoUnlock" autocomplete="off">
        <label class="ege-promo-unlock__label" for="egePromoPassword">Code</label>
        <input
          class="ege-promo-unlock__input"
          id="egePromoPassword"
          type="password"
          name="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="Code"
          required
        />
        <button class="ege-promo-unlock__go" type="submit">Go</button>
        <p class="ege-promo-unlock__error" id="egePromoUnlockError" hidden>Wrong code.</p>
      </form>
      <button type="button" class="ege-promo-gate-panel__no-code" id="egePromoNoCode">I don't have a code</button>
      <div class="ege-promo-gate-panel__subscribe" id="egePromoSubscribe" hidden>
        <a class="ege-promo-subscribe" href="https://t.me/yapoclock_bot?start=unlock" target="_blank" rel="noopener noreferrer">Subscribe to get code</a>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      isPromoUnlocked,
      persistPromoUnlock,
    } from "./js/promo-unlock.js";

    (function () {
      var EXAM_HREF = "topic.html?variant=2027-demo";
      var EGE_AT = new Date(2027, 5, 16, 10, 0, 0).getTime();
      var startBtn = document.getElementById("egePromoStartBtn");
      var gate = document.getElementById("egePromoGate");
      var gateBackdrop = document.getElementById("egePromoGateBackdrop");
      var noCodeBtn = document.getElementById("egePromoNoCode");
      var subscribe = document.getElementById("egePromoSubscribe");
      var form = document.getElementById("egePromoUnlock");
      var input = document.getElementById("egePromoPassword");
      var unlockError = document.getElementById("egePromoUnlockError");

      function padDigits(n, width) {
        var s = String(Math.max(0, n));
        while (s.length < width) s = "0" + s;
        if (s.length > width) s = s.slice(-width);
        return s;
      }

      function setDigit(id, ch) {
        var node = document.getElementById(id);
        if (node && node.textContent !== ch) node.textContent = ch;
      }

      function setDigitGroup(ids, value) {
        for (var i = 0; i < ids.length; i += 1) {
          setDigit(ids[i], value.charAt(i));
        }
      }

      function tickCountdown() {
        var el = document.getElementById("egeCountdown");
        if (!el) return;
        var ms = EGE_AT - Date.now();
        if (ms <= 0) {
          el.setAttribute("aria-label", "Date reached.");
          setDigitGroup(["egeCdD0", "egeCdD1", "egeCdD2"], "000");
          setDigitGroup(["egeCdH0", "egeCdH1"], "00");
          setDigitGroup(["egeCdM0", "egeCdM1"], "00");
          setDigitGroup(["egeCdS0", "egeCdS1"], "00");
          return;
        }
        var totalSec = Math.floor(ms / 1000);
        var days = Math.floor(totalSec / 86400);
        var hours = Math.floor((totalSec % 86400) / 3600);
        var mins = Math.floor((totalSec % 3600) / 60);
        var secs = totalSec % 60;
        el.setAttribute(
          "aria-label",
          days + " days " + hours + " hours " + mins + " minutes " + secs + " seconds"
        );
        setDigitGroup(["egeCdD0", "egeCdD1", "egeCdD2"], padDigits(days, 3));
        setDigitGroup(["egeCdH0", "egeCdH1"], padDigits(hours, 2));
        setDigitGroup(["egeCdM0", "egeCdM1"], padDigits(mins, 2));
        setDigitGroup(["egeCdS0", "egeCdS1"], padDigits(secs, 2));
      }

      function isUnlocked() {
        return isPromoUnlocked();
      }

      function persistUnlock() {
        persistPromoUnlock();
      }

      function goToExam() {
        window.location.href = EXAM_HREF;
      }

      function showGate() {
        if (!gate) return;
        gate.hidden = false;
        document.body.classList.add("yap-promo--gate-open");
        if (unlockError) unlockError.hidden = true;
        if (subscribe) subscribe.hidden = true;
        if (noCodeBtn) noCodeBtn.hidden = false;
        if (input) {
          window.setTimeout(function () {
            input.focus();
          }, 0);
        }
      }

      function hideGate() {
        if (!gate) return;
        gate.hidden = true;
        document.body.classList.remove("yap-promo--gate-open");
        if (unlockError) unlockError.hidden = true;
        if (subscribe) subscribe.hidden = true;
        if (noCodeBtn) noCodeBtn.hidden = false;
        if (input) {
          input.classList.remove("is-invalid");
          input.value = "";
        }
      }

      function rejectPassword() {
        if (!input) return;
        input.classList.add("is-invalid");
        input.value = "";
        if (unlockError) unlockError.hidden = false;
        input.focus();
      }

      function tryUnlock(guess) {
        return fetch("/api/unlock", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: guess }),
        })
          .then(function (res) {
            return res
              .json()
              .catch(function () {
                return {};
              })
              .then(function (data) {
                return res.ok && data.ok === true;
              });
          })
          .catch(function () {
            return false;
          });
      }

      if (form && input) {
        form.addEventListener("submit", function (event) {
          event.preventDefault();
          var guess = String(input.value || "").trim();
          var btn = form.querySelector('[type="submit"]');
          if (!guess) {
            rejectPassword();
            return;
          }
          if (btn) btn.disabled = true;
          tryUnlock(guess)
            .then(function (ok) {
              if (ok) {
                persistUnlock();
                goToExam();
                return;
              }
              rejectPassword();
            })
            .then(function () {
              if (btn) btn.disabled = false;
            });
        });
        input.addEventListener("input", function () {
          input.classList.remove("is-invalid");
          if (unlockError) unlockError.hidden = true;
        });
      }

      if (startBtn) {
        startBtn.addEventListener("click", function () {
          if (isUnlocked()) {
            goToExam();
            return;
          }
          showGate();
        });
      }

      if (gateBackdrop) {
        gateBackdrop.addEventListener("click", hideGate);
      }

      if (noCodeBtn && subscribe) {
        noCodeBtn.addEventListener("click", function () {
          subscribe.hidden = false;
          noCodeBtn.hidden = true;
        });
      }

      document.addEventListener("keydown", function (event) {
        if (event.key !== "Escape" || !gate || gate.hidden) return;
        hideGate();
      });

      if (location.hash === "#code" || new URLSearchParams(location.search).get("code") === "1") {
        showGate();
      }

      tickCountdown();
      setInterval(tickCountdown, 1000);
    })();
  </script>
  <script src="shared/site-footer.js"></script>
</body>
</html>
