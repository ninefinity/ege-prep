<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabulary in Context – ЕГЭ Prep – Yap O'Clock</title>
  <link rel="icon" href="assets/clocklogo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/site-footer.css" />
  <style>
:root {
  /* Yap O'Clock brand */
  --yap-hot: #f90240;
  --yap-royal: #01089e;
  --yap-paper: #eef0fa;
  --yap-ink: #0b072e;
  --yap-mist: #a4a5c1;
  --yap-wine: #981b40;
  --yap-dust: #6a69a5;
  --yap-navy: #00003b;

  --ege-ink: var(--yap-ink);
  --ege-muted: var(--yap-dust);
  --ege-line: #c4c5d8;
  --ege-bg: #e6e7f4;
  --ege-card: rgba(238, 240, 250, 0.96);
  --ege-primary: var(--yap-ink);
  --ege-accent: var(--yap-hot);
  --ege-accent-deep: var(--yap-wine);
  --ege-accent-soft: #fde8ef;
  --ege-accent-glow: rgba(249, 2, 64, 0.22);
  --ege-ok: #27ae60;
  --ege-ok-bg: #d5f5e3;
  --ege-bad: #c0392b;
  --ege-bad-bg: #fadbd8;
  --ege-text-ok-bg: var(--ege-ok-bg);
  --ege-text-ok-fg: var(--ege-ink);
  --ege-text-bad-bg: var(--ege-bad-bg);
  --ege-text-mark-pad: 1px 4px;
  --ege-text-mark-radius: 3px;
  --ege-wrong-pick: var(--yap-royal);
  --ege-wrong-pick-bg: #e6e8fc;
  --ege-mixed-bg: #fff0f4;
  --ege-radius: 12px;
  --ege-shadow: 0 4px 16px rgba(11, 7, 46, 0.1), 0 1px 3px rgba(11, 7, 46, 0.07);
  --ege-font-ui: "Fredoka", system-ui, sans-serif;
  --ege-font-text: "Montserrat", system-ui, sans-serif;
  --ege-font-cyrillic: "Montserrat", system-ui, sans-serif;
  --ege-workspace-min: 480px;
  --ege-workspace-max: calc(100vh - 120px);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  background-color: var(--ege-bg);
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-family: var(--ege-font-text);
  color: var(--ege-ink);
  background-color: var(--ege-bg);
  background-image:
    radial-gradient(ellipse 90% 55% at 12% -10%, rgba(1, 8, 158, 0.22), transparent 55%),
    radial-gradient(ellipse 70% 50% at 92% 8%, rgba(249, 2, 64, 0.16), transparent 50%),
    radial-gradient(ellipse 60% 45% at 50% 100%, rgba(106, 105, 165, 0.18), transparent 55%);
  background-attachment: fixed;
  background-repeat: no-repeat;
  line-height: 1.65;
}

a {
  color: var(--ege-accent-deep);
}

.ege-page {
  flex: 1;
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding: 16px 18px 32px;
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  gap: 20px 24px;
  align-items: start;
}

.ege-topics {
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  padding-right: 4px;
  grid-row: 1;
  align-self: start;
}

.ege-rail {
  min-width: 0;
}

.ege-rail__head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.ege-rail__mark {
  display: block;
  width: 64px;
  height: auto;
  flex-shrink: 0;
  object-fit: contain;
}

.ege-rail__title {
  margin: 0;
  font-family: var(--ege-font-cyrillic);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--ege-primary);
  line-height: 1.15;
  min-width: 0;
}

.ege-back {
  display: inline-block;
  margin-bottom: 10px;
  font-family: var(--ege-font-ui);
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--ege-muted);
  text-decoration: none;
}

.ege-back:hover {
  color: var(--ege-accent-deep);
}

.ege-workspace {
  min-width: 0;
  display: grid;
  gap: 10px;
}

/* ── Topbar ── */
.ege-topbar {
  display: grid;
  gap: 10px;
  margin-bottom: 0;
}

.ege-topbar--compact .ege-topbar__main {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.ege-topbar__title {
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  font-family: var(--ege-font-cyrillic);
  font-size: clamp(0.95rem, 2.4vw, 1.15rem);
  font-weight: 600;
  color: var(--ege-primary);
  line-height: 1.45;
  min-width: 0;
  flex: 1;
  white-space: normal;
  max-width: 72ch;
}

.ege-tips-toggle {
  flex-shrink: 0;
  width: 52px;
  height: 52px;
  margin-left: auto;
  border: 2px solid #e11d48;
  background: #fff;
  padding: 4px;
  cursor: pointer;
  border-radius: 12px;
  box-shadow:
    0 0 0 3px rgba(225, 29, 72, 0.18),
    0 0 10px rgba(225, 29, 72, 0.26),
    0 0 18px rgba(225, 29, 72, 0.16);
  animation: ege-tips-glow 2.2s ease-in-out infinite;
}

.ege-tips-toggle:hover,
.ege-tips-toggle:focus-visible {
  outline: none;
  border-color: #be123c;
  box-shadow:
    0 0 0 3px rgba(225, 29, 72, 0.28),
    0 0 14px rgba(225, 29, 72, 0.36),
    0 0 22px rgba(225, 29, 72, 0.2);
}

.ege-tips-toggle__icon {
  display: block;
  width: 36px;
  height: 36px;
  margin: 2px auto;
  object-fit: contain;
  animation: ege-tips-flash 2.2s ease-in-out infinite;
}

.ege-tips-toggle.is-seen {
  animation: none;
  border-color: var(--ege-line);
  box-shadow: none;
}

.ege-tips-toggle.is-seen:hover,
.ege-tips-toggle.is-seen:focus-visible {
  border-color: var(--ege-accent);
  box-shadow: none;
}

.ege-tips-toggle.is-seen .ege-tips-toggle__icon {
  animation: none;
}

@keyframes ege-tips-flash {
  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.78;
    transform: scale(1.03);
  }
}

@keyframes ege-tips-glow {
  0%,
  100% {
    box-shadow:
      0 0 0 3px rgba(225, 29, 72, 0.18),
      0 0 8px rgba(225, 29, 72, 0.22),
      0 0 14px rgba(225, 29, 72, 0.14);
  }
  50% {
    box-shadow:
      0 0 0 3px rgba(225, 29, 72, 0.24),
      0 0 12px rgba(225, 29, 72, 0.34),
      0 0 20px rgba(225, 29, 72, 0.2);
  }
}

.ege-tips {
  margin-top: 4px;
  padding: 22px 20px;
  border: 1px solid var(--ege-line);
  border-radius: 16px;
  background: #fff;
  box-shadow: var(--ege-shadow);
  max-width: none;
  width: 100%;
  color: var(--ege-ink);
  line-height: 1.6;
}

.ege-tips[hidden] {
  display: none;
}

.ege-tips__heading {
  margin: 0 0 14px;
  font-family: var(--ege-font-ui);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--ege-ink);
}

.ege-tips__section {
  margin: 28px 0 12px;
  font-family: var(--ege-font-ui);
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--ege-accent);
  padding-bottom: 6px;
  border-bottom: 2px solid #e0e7ff;
}

.ege-tips__starters {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin: 0 0 16px;
  padding: 0;
  list-style: none;
}

@media (max-width: 640px) {
  .ege-tips__starters {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.ege-tips__starters li {
  background: #f8fafc;
  border: 1px solid var(--ege-line);
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 0.92rem;
  color: #334155;
}

.ege-tips__starters code {
  background: #dbeafe;
  color: #1e40af;
  padding: 2px 6px;
  border-radius: 5px;
  font-family: var(--ege-font-ui);
  font-weight: 600;
  font-size: 0.9em;
}

.ege-tips__starters span {
  color: #64748b;
  font-size: 0.84em;
}

.ege-tips__note {
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-left: 4px solid #f59e0b;
  padding: 10px 14px;
  border-radius: 0 10px 10px 0;
  margin: 0 0 8px;
  font-size: 0.93rem;
  color: #92400e;
}

.ege-tips__key {
  background: #f1f5f9;
  border: 1px solid var(--ege-line);
  padding: 11px 14px;
  border-radius: 10px;
  margin: 0 0 16px;
  font-size: 0.95rem;
}

.ege-tips__map {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(170px, 0.75fr) minmax(0, 1.75fr);
  border: 1px solid var(--ege-line);
  border-radius: 12px;
  overflow: hidden;
  margin: 0 0 16px;
}

.ege-tips__map-head {
  background: #eef4ff;
  font-family: var(--ege-font-ui);
  font-weight: 700;
  font-size: 0.88rem;
  color: #1e3a8a;
  padding: 10px 12px;
  border-bottom: 1px solid var(--ege-line);
}

.ege-tips__map-cell {
  padding: 10px 12px;
  border-bottom: 1px solid var(--ege-line);
  font-size: 0.9rem;
  line-height: 1.45;
  color: var(--ege-ink);
}

.ege-tips__map-cell:nth-last-child(-n + 3) {
  border-bottom: none;
}

.ege-tips__map-cell code {
  background: #dbeafe;
  color: #1e40af;
  padding: 2px 6px;
  border-radius: 5px;
  font-family: var(--ege-font-ui);
  font-weight: 600;
  font-size: 0.9em;
}

.ege-tips__connector {
  background: #dbeafe;
  color: #1e40af;
  padding: 0 3px;
  border-radius: 4px;
  font-weight: 700;
}

@media (max-width: 760px) {
  .ege-tips__map {
    grid-template-columns: 1fr;
  }

  .ege-tips__map-head {
    border-bottom: 1px solid var(--ege-line);
  }
}

.ege-tips__card {
  background: #fff;
  border: 1px solid var(--ege-line);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 12px;
}

.ege-tips__card:hover {
  border-color: #bfdbfe;
}

.ege-tips__card p {
  margin: 0 0 6px;
  font-size: 0.92rem;
  color: var(--ege-ink);
}

.ege-tips__card p:last-child {
  margin-bottom: 0;
}

.ege-tips__card ul {
  margin: 8px 0 0;
  padding-left: 18px;
  font-size: 0.92rem;
}

.ege-tips__card li + li {
  margin-top: 3px;
}

.ege-tips__title {
  font-family: var(--ege-font-ui);
  font-weight: 700;
  font-size: 1.02rem;
  margin: 0 0 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ege-ink);
}

.ege-tips__title::before {
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

.ege-tips__title--that::before {
  background: #3b82f6;
}

.ege-tips__title--which::before {
  background: #6366f1;
}

.ege-tips__title--who::before {
  background: #ec4899;
}

.ege-tips__title--ving::before {
  background: #10b981;
}

.ege-tips__title--but::before {
  background: #f97316;
}

.ege-tips__title--aswell::before {
  background: #0ea5e9;
}

.ege-tips__title--than::before {
  background: #64748b;
}

.ege-tips__tip {
  margin-top: 10px;
  padding: 9px 12px;
  background: #eff6ff;
  border: 1px solid #dbeafe;
  border-radius: 8px;
  font-size: 0.9rem;
  color: #1e40af;
}

.ege-tips__tip--subtle {
  background: #f8fafc;
  border-color: var(--ege-line);
  color: #64748b;
}

.ege-tips__hide {
  margin-top: 8px;
}

.ege-back {
  display: inline-block;
  text-decoration: none;
  color: var(--ege-accent);
  font-family: var(--ege-font-ui);
  font-weight: 600;
  font-size: 0.84rem;
  white-space: nowrap;
}

.ege-back:hover {
  color: var(--ege-ink);
}

.ege-header h1,
.ege-header__title {
  margin: 0;
  font-family: var(--ege-font-cyrillic);
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 700;
  color: var(--ege-primary);
  line-height: 1.15;
}

.ege-header__title {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
}

.ege-brand-mark {
  display: block;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border-radius: 50%;
  object-fit: cover;
}

.ege-brand-mark--sm {
  width: 32px;
  height: 32px;
}

.ege-kicker {
  margin: 0;
  font-family: var(--ege-font-cyrillic);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ege-accent);
}

.ege-lede {
  margin: 0;
  color: var(--ege-muted);
  font-size: 0.95rem;
  line-height: 1.6;
  max-width: 56ch;
}

/* ── Task nav ── */
.ege-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.ege-nav__btn {
  border: 1px solid transparent;
  background: transparent;
  color: var(--ege-primary);
  padding: 8px 10px;
  border-radius: 8px;
  font-family: var(--ege-font-ui);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  width: 100%;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

.ege-nav__btn:hover {
  background: var(--ege-accent-soft);
  border-color: var(--ege-line);
}

.ege-nav__btn.is-active {
  background: var(--ege-accent);
  border-color: var(--ege-accent);
  color: #fff;
}

.ege-nav__btn.is-perfect:not(.is-active) {
  box-shadow: inset 3px 0 0 var(--ege-ok);
}

.ege-nav__btn.is-partial:not(.is-active) {
  box-shadow: inset 3px 0 0 #ca8a04;
}

/* Mobile task switcher — two horizontal lines */
.ege-mobile-switch {
  display: none;
}

.ege-mobile-switch__line--end {
  display: none;
}

/* ── Task panel ── */
.ege-task-panel {
  animation: ege-fade 0.25s ease;
}

@keyframes ege-fade {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.ege-instructions {
  margin: 0 0 14px;
  font-size: 0.92rem;
  color: var(--ege-ink);
  line-height: 1.55;
  max-width: 72ch;
}

.ege-instructions .ege-badge {
  margin-right: 6px;
}

.ege-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--ege-accent-soft);
  color: var(--ege-accent);
  font-family: var(--ege-font-ui);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  vertical-align: middle;
}

.ege-task {
  background: var(--ege-card);
  border: 1px solid rgba(0, 0, 0, 0.06);
  border-radius: var(--ege-radius);
  padding: 14px;
  box-shadow: var(--ege-shadow);
}

.ege-task--panels {
  padding: 0;
  background: transparent;
  border: none;
  box-shadow: none;
  display: grid;
  gap: 12px;
}

.ege-answer-box {
  display: grid;
  gap: 14px;
}

.ege-answer-box .ege-ref__list {
  grid-template-columns: 1fr;
}

@media (min-width: 720px) {
  .ege-answer-box .ege-ref__list {
    grid-template-columns: 1fr 1fr;
  }
}

.ege-panel--answers .ege-gap-picks {
  border-top: none;
  padding-top: 0;
  max-width: none;
  width: fit-content;
}

.ege-panel--answers .ege-panel__label {
  margin-bottom: 8px;
}

.ege-panel--answers .ege-gap-picks {
  display: block;
}

.ege-answer-table {
  display: grid;
  gap: 8px;
  width: fit-content;
  max-width: 100%;
  padding: 10px 12px;
  background: var(--ege-card);
  border: 1px solid var(--ege-line);
  border-radius: var(--ege-radius);
}

.ege-panel--answers .ege-match-pill--clear {
  justify-self: start;
  width: 38px;
  min-width: 0;
  min-height: 40px;
  padding: 0;
  font-size: 1rem;
  font-weight: 700;
  line-height: 1;
  color: #b91c1c;
  background: #fee2e2;
  border-color: #fecaca;
  opacity: 1;
}

.ege-panel--answers .ege-match-pill--clear:hover {
  color: #991b1b;
  background: #fecaca;
  border-color: #fca5a5;
}

.ege-answer-box .ege-match-letters,
.ege-answer-box .ege-match-numbers,
.ege-sidebar-work .ege-match-letters,
.ege-sidebar-work .ege-match-numbers,
.ege-panel--answers .ege-match-letters,
.ege-panel--answers .ege-match-numbers {
  display: grid;
  grid-template-columns: repeat(7, 38px);
  gap: 6px;
  justify-content: start;
}

.ege-answer-box .ege-match-letters,
.ege-sidebar-work .ege-match-letters,
.ege-panel--answers .ege-match-letters {
  grid-template-columns: repeat(7, 38px);
}

.ege-answer-box .ege-match-letters .ege-match-pill,
.ege-answer-box .ege-match-numbers .ege-match-pill,
.ege-sidebar-work .ege-match-letters .ege-match-pill,
.ege-sidebar-work .ege-match-numbers .ege-match-pill,
.ege-panel--answers .ege-match-letters .ege-match-pill,
.ege-panel--answers .ege-match-numbers .ege-match-pill {
  flex: none;
  width: 38px;
  min-width: 0;
  padding: 6px 0;
}

.ege-answer-box .ege-match-pill--clear,
.ege-sidebar-work .ege-match-pill--clear {
  justify-self: start;
  width: auto;
  padding: 6px 12px;
}

.ege-panel--parts .ege-ref__list {
  grid-template-columns: 1fr;
}

@media (min-width: 720px) {
  .ege-panel--parts .ege-ref__list {
    grid-template-columns: 1fr 1fr;
  }
}

.ege-panel {
  border: 1px solid var(--ege-line);
  border-radius: var(--ege-radius);
  background: var(--ege-card);
  padding: 16px;
  min-height: 0;
}

.ege-panel.ege-panel--answers {
  background: transparent;
  border: none;
  padding: 0;
  box-shadow: none;
  width: fit-content;
  max-width: 100%;
}

.ege-panel__label {
  margin: 0 0 12px;
  font-family: var(--ege-font-ui);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ege-muted);
}

.ege-ref-strip {
  margin: 0;
}

.ege-panel--read .ege-passage,
.ege-panel--read .ege-text-block,
.ege-panel--read .ege-gapfill-passage {
  font-size: 1rem;
  line-height: 1.85;
}

.ege-panel--work .ege-mc-stack {
  display: grid;
  gap: 10px;
}

.ege-sidebar-work {
  display: grid;
  gap: 12px;
}

.ege-panel--solo {
  min-height: min(var(--ege-workspace-min), 60vh);
  max-height: var(--ege-workspace-max);
  overflow-y: auto;
}

/* ── Side-by-side panels ── */
.ege-split {
  display: grid;
  gap: 12px;
}

.ege-split--panels {
  gap: 12px;
}

@media (min-width: 768px) {
  .ege-split--panels {
    grid-template-columns: minmax(0, 1.75fr) minmax(220px, 0.82fr);
    gap: 12px;
    align-items: start;
  }

  .ege-split--panels .ege-split__read,
  .ege-split--panels .ege-split__work {
    border: none;
    padding: 0;
    min-width: 0;
  }

  .ege-split--panels .ege-split__read {
    position: static;
  }

  .ege-split--panels .ege-split__work {
    position: sticky;
    top: 72px;
    max-height: var(--ege-workspace-max);
    overflow-y: auto;
  }

  .ege-split--panels .ege-panel--read {
    min-height: var(--ege-workspace-min);
    max-height: none;
    overflow: visible;
  }

  .ege-split--panels .ege-panel--work {
    min-height: 0;
    max-height: var(--ege-workspace-max);
    overflow-y: auto;
    padding: 12px;
  }

  .ege-split--panels .ege-panel--solo {
    min-height: var(--ege-workspace-min);
    max-height: var(--ege-workspace-max);
    overflow-y: auto;
  }

  .ege-split--panels .ege-split__read .ege-passage,
  .ege-split--panels .ege-split__read .ege-text-block,
  .ege-split--panels .ege-split__read .ege-gapfill-passage {
    max-height: none;
    overflow: visible;
    padding-right: 0;
  }

  .ege-panel--work .ege-panel__label {
    margin-bottom: 8px;
  }

  .ege-panel--work .ege-ref__list {
    grid-template-columns: 1fr;
    gap: 6px;
  }

  .ege-panel--work .ege-ref__list li {
    font-size: 1rem;
    line-height: 1.65;
  }

  .ege-panel--work .ege-match-read {
    gap: 10px;
  }

  .ege-split--panels .ege-gap-picks,
  .ege-split--panels .ege-match-picks {
    border-top: none;
    padding-top: 0;
  }

  .ege-split--panels .ege-vocab-picks .ege-match-words {
    flex-direction: column;
    align-items: stretch;
  }

  .ege-split--panels .ege-vocab-picks .ege-match-pill--word {
    width: 100%;
    justify-content: flex-start;
    text-align: left;
  }
}

@media (max-width: 767px) {
  .ege-split--panels .ege-panel--read,
  .ege-split--panels .ege-panel--work,
  .ege-panel--solo {
    min-height: min(360px, 55vh);
  }
}

.ege-ref__list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px 20px;
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: ege-ref;
}

.ege-ref__list li {
  display: grid;
  grid-template-columns: 1.6em 1fr;
  gap: 0 6px;
  font-size: 1rem;
  line-height: 1.65;
  counter-increment: ege-ref;
  opacity: 0.72;
  transition: opacity 0.12s, color 0.12s;
}

.ege-ref__list li.is-used {
  opacity: 1;
  color: var(--ege-accent-deep);
  font-weight: 600;
}

.ege-ref__list li::before {
  content: counter(ege-ref) ".";
  font-family: var(--ege-font-ui);
  font-weight: 700;
  color: var(--ege-accent);
  text-align: right;
}

@media (min-width: 560px) {
  .ege-ref__list {
    grid-template-columns: repeat(2, 1fr);
  }

  .ege-panel--work .ege-ref__list {
    grid-template-columns: 1fr;
  }
}

/* ── Matching: one shared number row ── */
.ege-match-read {
  display: grid;
  gap: 14px;
}

.ege-match-picks {
  display: grid;
  gap: 10px;
  padding-top: 12px;
  border-top: 1px solid var(--ege-line);
}

.ege-match-letters,
.ege-match-numbers {
  display: flex;
  flex-wrap: nowrap;
  gap: 4px;
}

.ege-match-words {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.ege-match-letters .ege-match-pill,
.ege-match-numbers .ege-match-pill {
  flex: 1 1 0;
  min-width: 0;
  padding: 6px 4px;
}

.ege-match-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-width: 36px;
  min-height: 36px;
  padding: 6px 12px;
  border: 1px solid var(--ege-line);
  border-radius: 8px;
  background: #fff;
  font-family: var(--ege-font-ui);
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--ege-primary);
  cursor: pointer;
  opacity: 0.72;
  transition: background 0.12s, border-color 0.12s, color 0.12s, opacity 0.12s;
}

.ege-match-pill--num {
  padding: 6px 4px;
}

.ege-match-pill--clear {
  justify-self: start;
  min-width: auto;
  padding: 6px 12px;
  font-weight: 600;
  color: var(--ege-muted);
  opacity: 0.85;
}

.ege-match-pill--word {
  min-width: auto;
  padding: 8px 14px;
  min-height: 40px;
  font-size: 1rem;
  font-weight: 600;
}

.ege-match-pill.is-active .ege-gap-pick {
  color: #fff;
}

.ege-match-letter__pick {
  min-width: 1ch;
  font-size: 0.78rem;
  font-weight: 700;
}

.ege-match-pill:hover {
  border-color: var(--yap-royal);
  background: var(--ege-wrong-pick-bg);
  opacity: 0.9;
}

.ege-match-pill--gap.is-used:not(.is-active) {
  opacity: 1;
  background: var(--ege-wrong-pick-bg);
  border-color: color-mix(in srgb, var(--yap-royal) 35%, var(--ege-line));
  color: var(--yap-royal);
}

.ege-match-pill--gap.is-active {
  opacity: 1;
  background: var(--yap-royal);
  border-color: var(--yap-royal);
  color: #fff;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--yap-royal) 32%, transparent);
  z-index: 1;
}

.ege-match-pill--gap.is-active .ege-match-letter__pick,
.ege-match-pill--gap.is-active .ege-gap-pick {
  color: #fff;
}

.ege-match-pill--num.is-used:not(.is-selected):not(.is-locked) {
  opacity: 0.38;
  background: #eef0f4;
  border-color: var(--ege-line);
  color: var(--ege-muted);
  text-decoration: line-through;
  cursor: not-allowed;
}

.ege-match-pill--num.is-used:not(.is-selected):not(.is-locked):hover {
  opacity: 0.38;
  background: #eef0f4;
  border-color: var(--ege-line);
  color: var(--ege-muted);
}

.ege-match-pill.is-selected {
  opacity: 1;
  background: var(--yap-royal);
  border-color: var(--yap-royal);
  color: #fff;
  text-decoration: none;
}

.ege-vocab-picks.is-suppress-hover .ege-match-pill--word:hover {
  border-color: var(--ege-line);
  background: #fff;
  opacity: 0.72;
  color: var(--ege-primary);
}

.ege-match-pill.is-correct {
  opacity: 1;
  background: var(--ege-ok-bg);
  border-color: var(--ege-ok);
  color: var(--ege-ok);
}

.ege-match-pill.is-locked {
  cursor: default;
  pointer-events: none;
  box-shadow: none;
}

.ege-match-pill.is-locked.is-correct {
  opacity: 1;
  background: var(--ege-ok-bg) !important;
  border-color: var(--ege-ok) !important;
  color: var(--ege-ok) !important;
}

.ege-match-pill.is-wrong {
  opacity: 1;
  background: var(--ege-bad-bg);
  border-color: var(--ege-bad);
  color: var(--ege-bad);
}

.ege-match-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

/* ── Text blocks ── */
.ege-text-block {
  margin: 0 0 14px;
  font-size: 0.95rem;
  line-height: 1.75;
}

.ege-text-block:last-child {
  margin-bottom: 0;
}

.ege-text-block strong {
  color: var(--ege-accent-deep);
}

.ege-passage {
  font-size: 0.95rem;
  line-height: 1.8;
}

/* ── Text highlighter (outside task box) ── */
.ege-highlight-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}

.ege-highlight-tools__btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 40px;
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--ege-line);
  border-radius: 10px;
  background: var(--ege-card);
  box-shadow: var(--ege-shadow);
  font-family: var(--ege-font-ui);
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--ege-primary);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s, box-shadow 0.12s;
}

.ege-highlight-tools__icon {
  width: 18px;
  height: 18px;
  display: block;
}

.ege-highlight-tools__btn:hover {
  border-color: var(--ege-line);
  background: #f8fafc;
}

.ege-highlight-tools__btn.is-active {
  background: #e2e8f0;
  border-color: var(--ege-line);
  color: var(--ege-primary);
  box-shadow: none;
}

.ege-highlight-tools__btn[data-mode="highlight"]:hover {
  border-color: #facc15;
  background: #fef9c3;
}

.ege-highlight-tools__btn[data-mode="highlight"].is-active {
  background: #fde68a;
  border-color: #facc15;
  color: #854d0e;
  box-shadow: 0 4px 12px rgba(250, 204, 21, 0.25);
}

.ege-highlight-tools__btn--ghost {
  color: var(--ege-muted);
  min-width: auto;
  padding: 0 14px;
}

.ege-highlightable {
  user-select: text;
  -webkit-user-select: text;
}

.ege-highlightable.ege-erase-mode {
  cursor: default;
}

.ege-highlightable .ege-highlight {
  background: rgba(250, 204, 21, 0.35);
  color: inherit;
  border-radius: 2px;
  padding: 0 2px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}

.ege-highlightable.ege-erase-mode .ege-highlight {
  cursor: pointer;
  outline: 1px dashed rgba(202, 138, 4, 0.6);
  outline-offset: 1px;
}

.ege-mc-stack {
  display: grid;
  gap: 10px;
}

.ege-mc-card {
  padding: 12px 14px;
  border: 1px solid var(--ege-line);
  border-radius: 10px;
  background: #fff;
}

.ege-mc-card:last-child {
  margin-bottom: 0;
}

.ege-mc__prompt {
  font-weight: 600;
  font-size: 0.9rem;
  margin: 0 0 10px;
  padding: 0;
  line-height: 1.55;
}

.ege-choice-group--mc {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  margin-top: 0;
}

.ege-pill--option {
  width: 100%;
  min-height: 44px;
  border-radius: 10px;
  padding: 10px 12px;
}

/* ── Pill choice groups ── */
.ege-choice-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.ege-choice-group--inline {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 0 2px;
  vertical-align: middle;
}

.ege-choice-group--grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}

@media (min-width: 640px) {
  .ege-choice-group--grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.ege-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  min-height: 32px;
  padding: 4px 10px;
  border: 1px solid var(--ege-line);
  border-radius: 8px;
  background: #fff;
  font-family: var(--ege-font-ui);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--ege-primary);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
  user-select: none;
}

.ege-pill--text {
  min-width: 0;
  justify-content: flex-start;
  border-radius: 8px;
  padding: 8px 12px;
  font-family: var(--ege-font-text);
  font-size: 0.88rem;
  font-weight: 500;
  line-height: 1.55;
  text-align: left;
}

.ege-pill input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}

.ege-pill:hover {
  border-color: var(--yap-royal);
  background: var(--ege-wrong-pick-bg);
}

.ege-pill:has(input:checked) {
  background: var(--ege-wrong-pick-bg);
  border-color: var(--yap-royal);
  color: var(--yap-royal);
}

.ege-pill.is-correct {
  background: var(--ege-ok-bg);
  border-color: var(--ege-ok);
  color: var(--ege-ok);
}

.ege-pill.is-wrong {
  background: var(--ege-bad-bg);
  border-color: var(--ege-bad);
  color: var(--ege-bad);
}

.ege-gapfill-passage {
  font-size: 1rem;
  line-height: 1.85;
}

.ege-gap-insert {
  display: inline;
  white-space: normal;
  cursor: pointer;
}

.ege-gap-insert:focus-visible {
  outline: 2px solid var(--yap-royal);
  outline-offset: 2px;
  border-radius: 4px;
}

.ege-gap-insert.is-active-gap:not(.is-filled) {
  border: 2px solid var(--yap-royal);
  background: color-mix(in srgb, var(--ege-wrong-pick-bg) 70%, #fff);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--yap-royal) 28%, transparent);
}

.ege-gap-insert.is-active-gap.is-filled .ege-gap-insert__text {
  background: color-mix(in srgb, var(--ege-wrong-pick-bg) 55%, #fff);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--yap-royal) 32%, transparent);
  outline: 2px solid var(--yap-royal);
  outline-offset: 1px;
}

.ege-gap-insert.is-hover-match:not(.is-filled) {
  border-color: var(--yap-royal);
  background: color-mix(in srgb, var(--ege-wrong-pick-bg) 85%, #fff);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--yap-royal) 18%, transparent);
}

.ege-gap-insert.is-hover-match.is-filled .ege-gap-insert__text {
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--yap-royal) 22%, transparent);
}

.ege-gap-insert.is-just-filled .ege-gap-insert__text,
.ege-gap-insert.is-just-filled:not(.is-filled) {
  animation: ege-gap-flash 0.55s ease;
}

@keyframes ege-gap-flash {
  0% {
    background: color-mix(in srgb, var(--yap-royal) 28%, var(--ege-wrong-pick-bg));
  }
  100% {
    background: var(--ege-wrong-pick-bg);
  }
}

.ege-gap-insert.is-empty:not(.is-filled) {
  background: var(--ege-bad-bg);
  border-color: var(--ege-bad);
  color: var(--ege-bad);
}

.ege-gap-insert.is-empty:not(.is-filled)::after {
  color: color-mix(in srgb, var(--ege-bad) 70%, var(--ege-muted));
}

.ege-gap-insert.is-locked {
  cursor: default;
  pointer-events: none;
}

.ege-gap-insert:not(.is-filled) {
  display: inline-block;
  padding: 1px 8px;
  margin: 0 1px;
  border: 1px dashed color-mix(in srgb, var(--yap-royal) 45%, transparent);
  border-radius: 6px;
  background: var(--ege-wrong-pick-bg);
  font-family: var(--ege-font-ui);
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--yap-royal);
  vertical-align: baseline;
}

.ege-gap-insert:not(.is-filled)::before {
  content: attr(data-gap);
}

.ege-gap-insert:not(.is-filled)::after {
  content: " ···";
  font-weight: 600;
  color: var(--ege-muted);
}

.ege-gap-insert__text {
  font-weight: 500;
}

.ege-gap-insert.is-filled .ege-gap-insert__text {
  background: var(--ege-wrong-pick-bg);
  color: var(--yap-royal);
  padding: 1px 4px;
  border-radius: 3px;
  font-weight: 700;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}

.ege-gap-insert.is-filled .ege-gap-insert__text:empty {
  display: none;
}

.ege-gap-insert.is-correct.is-filled .ege-gap-insert__text {
  background: var(--ege-ok-bg);
}

.ege-gap-insert.is-wrong.is-filled .ege-gap-insert__text {
  background: var(--ege-bad-bg);
}

.ege-gap-picks {
  display: grid;
  gap: 10px;
  padding-top: 12px;
  border-top: 1px solid var(--ege-line);
}

.ege-gap-picks .ege-match-pill {
  font-size: 0.95rem;
  min-height: 40px;
}

.ege-gap-pick {
  min-width: 1ch;
  font-size: 0.95rem;
  font-weight: 700;
}

.ege-gap-pick:empty {
  display: none;
}

/* ── Word formation ── */
.ege-wordform {
  margin: 0 0 14px;
  font-size: 0.95rem;
  line-height: 1.85;
}

.ege-wordform__hint {
  margin: 0 4px;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ege-accent);
  letter-spacing: 0.03em;
}

.ege-input {
  font-family: var(--ege-font-text);
  font-size: 0.95rem;
  border: 1px solid var(--ege-line);
  border-radius: 8px;
  padding: 6px 10px;
  background: #fff;
  color: var(--ege-ink);
  min-height: 36px;
  width: 120px;
}

.ege-input.is-correct {
  border-color: var(--ege-ok);
  background: var(--ege-ok-bg);
}

.ege-input.is-wrong {
  border-color: var(--ege-bad);
  background: var(--ege-bad-bg);
}

/* ── Task footer ── */
.ege-task__footer {
  margin-top: 16px;
}

.ege-task--panels .ege-task__footer {
  margin-top: 12px;
}

.ege-task--panels .ege-panel {
  border-bottom: none;
}

.ege-task__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.ege-btn {
  border-radius: 8px;
  padding: 10px 20px;
  font-family: var(--ege-font-ui);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s;
}

.ege-btn--primary {
  background: var(--ege-accent);
  color: #fff;
}

.ege-btn--primary:hover {
  background: var(--yap-wine);
}

.ege-btn:disabled,
.ege-btn--primary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.ege-btn--primary:disabled:hover {
  background: var(--yap-hot);
}

.ege-btn--ghost {
  background: #fff;
  border-color: var(--ege-line);
  color: var(--ege-muted);
}

.ege-btn--ghost:hover {
  border-color: var(--ege-accent);
  color: var(--ege-ink);
}

.ege-task__score {
  margin: 10px 0 0;
  padding: 8px 12px;
  min-height: 2.6em;
  border-radius: 8px;
  font-family: var(--ege-font-ui);
  font-weight: 600;
  font-size: 0.88rem;
  white-space: pre-line;
}

.ege-task__score[hidden] {
  display: block;
  visibility: hidden;
}

.ege-task__score.is-good {
  background: var(--ege-ok-bg);
  color: var(--ege-ok);
}

.ege-task__score.is-bad {
  background: var(--ege-bad-bg);
  color: var(--ege-bad);
}

.ege-task__score.is-mixed {
  background: var(--ege-mixed-bg);
  color: var(--ege-accent);
}

.ege-explain {
  margin-top: 12px;
  display: grid;
  gap: 10px;
}

.ege-explain[hidden] {
  display: none;
}

.ege-explain__item {
  background: #fff;
  border: 1px solid var(--ege-line);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 12px;
}

.ege-explain__item:hover {
  border-color: #bfdbfe;
}

.ege-explain__gap {
  margin: 0 0 8px;
  font-family: var(--ege-font-ui);
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--ege-ink);
  line-height: 1.45;
  display: flex;
  align-items: center;
  gap: 8px;
}

.ege-explain__gap::before {
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #3b82f6;
  flex-shrink: 0;
}

.ege-explain__jump {
  margin: 0;
  border: none;
  padding: 0;
  background: transparent;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: #93c5fd;
  text-underline-offset: 3px;
}

.ege-explain__jump:hover,
.ege-explain__jump:focus-visible {
  color: var(--ege-accent);
  text-decoration-color: var(--ege-accent);
}
