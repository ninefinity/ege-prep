  <script>
(function () {
  "use strict";

  var STORAGE_KEY = "ege-prep.highlights.v1";

  var ICON_PEN =
    '<svg class="ege-highlight-tools__icon" viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M15.5 2.5l6 6-12 12H3.5v-6l12-12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>' +
    '<path d="M14 4l6 6" fill="none" stroke="currentColor" stroke-width="2"/>' +
    "</svg>";

  var ICON_ERASER =
    '<svg class="ege-highlight-tools__icon" viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M7 21h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
    '<path d="M6.8 12.3L14 5.1l5.9 5.9-7.2 7.2H4.6V12.3h2.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>' +
    "</svg>";

  function loadAll() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (_err) {
      return {};
    }
  }

  function saveEntry(id, html) {
    try {
      var all = loadAll();
      if (html && html.indexOf("ege-highlight") !== -1) {
        all[id] = html;
      } else {
        delete all[id];
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    } catch (_err) {
      /* ignore quota errors */
    }
  }

  function unwrapHighlight(mark) {
    var parent = mark.parentNode;
    if (!parent) return;
    while (mark.firstChild) {
      parent.insertBefore(mark.firstChild, mark);
    }
    parent.removeChild(mark);
    parent.normalize();
  }

  function selectionInside(container, range) {
    return container.contains(range.commonAncestorContainer);
  }

  function selectionBlocked(range) {
    var node = range.commonAncestorContainer;
    if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
    if (!node || !node.closest) return false;
    return !!node.closest(
      ".ege-gap-picks, .ege-gap-insert:not(.is-filled), .ege-choice-group, button, .ege-highlight-tools, .ege-match-picks, .ege-input"
    );
  }

  function applyHighlight(container) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed) return false;

    var range = sel.getRangeAt(0);
    if (!selectionInside(container, range) || selectionBlocked(range)) {
      sel.removeAllRanges();
      return false;
    }

    var mark = document.createElement("mark");
    mark.className = "ege-highlight";

    try {
      var contents = range.extractContents();
      if (!contents.textContent.trim()) {
        sel.removeAllRanges();
        return false;
      }
      mark.appendChild(contents);
      range.insertNode(mark);
      sel.removeAllRanges();
      return true;
    } catch (_err) {
      sel.removeAllRanges();
      return false;
    }
  }

  function sanitizePassageHtml(container) {
    var clone = container.cloneNode(true);
    clone.querySelectorAll(".ege-gap-insert").forEach(function (insert) {
      insert.classList.remove("is-filled", "is-correct", "is-wrong");
      var text = insert.querySelector(".ege-gap-insert__text");
      if (text) text.textContent = "";
      else {
        var span = document.createElement("span");
        span.className = "ege-gap-insert__text";
        insert.appendChild(span);
      }
    });
    return clone.innerHTML;
  }

  function persistContainer(container) {
    var id = container.dataset.highlightId;
    if (id) saveEntry(id, sanitizePassageHtml(container));
  }

  function buildTaskToolbar(containers) {
    var tools = document.createElement("div");
    tools.className = "ege-highlight-tools";
    tools.setAttribute("role", "toolbar");
    tools.setAttribute("aria-label", "Reading tools");

    var highlightBtn = document.createElement("button");
    highlightBtn.type = "button";
    highlightBtn.className = "ege-highlight-tools__btn";
    highlightBtn.dataset.mode = "highlight";
    highlightBtn.innerHTML = ICON_PEN;
    highlightBtn.setAttribute("aria-label", "Highlight");
    highlightBtn.setAttribute("title", "Highlight");
    highlightBtn.setAttribute("aria-pressed", "false");

    var eraseBtn = document.createElement("button");
    eraseBtn.type = "button";
    eraseBtn.className = "ege-highlight-tools__btn";
    eraseBtn.dataset.mode = "erase";
    eraseBtn.innerHTML = ICON_ERASER;
    eraseBtn.setAttribute("aria-label", "Erase");
    eraseBtn.setAttribute("title", "Erase");
    eraseBtn.setAttribute("aria-pressed", "false");

    var clearBtn = document.createElement("button");
    clearBtn.type = "button";
    clearBtn.className = "ege-highlight-tools__btn ege-highlight-tools__btn--ghost";
    clearBtn.dataset.mode = "clear";
    clearBtn.textContent = "Clear";
    clearBtn.setAttribute("aria-label", "Clear all highlights");
    clearBtn.setAttribute("title", "Clear all");

    var mode = "none";

    function setMode(next) {
      mode = next;
      highlightBtn.classList.toggle("is-active", mode === "highlight");
      eraseBtn.classList.toggle("is-active", mode === "erase");
      highlightBtn.setAttribute("aria-pressed", mode === "highlight" ? "true" : "false");
      eraseBtn.setAttribute("aria-pressed", mode === "erase" ? "true" : "false");
      containers.forEach(function (container) {
        container.classList.toggle("ege-erase-mode", mode === "erase");
      });
    }

    function clearAll() {
      containers.forEach(function (container) {
        container.querySelectorAll(".ege-highlight").forEach(function (mark) {
          unwrapHighlight(mark);
        });
        persistContainer(container);
      });
    }

    highlightBtn.addEventListener("click", function () {
      setMode(mode === "highlight" ? "none" : "highlight");
    });

    eraseBtn.addEventListener("click", function () {
      setMode(mode === "erase" ? "none" : "erase");
    });

    clearBtn.addEventListener("click", function () {
      clearAll();
      setMode("none");
    });

    containers.forEach(function (container) {
      function tryHighlight() {
        if (mode !== "highlight") return;
        window.setTimeout(function () {
          if (applyHighlight(container)) persistContainer(container);
        }, 0);
      }

      container.addEventListener("mouseup", tryHighlight);
      container.addEventListener("touchend", tryHighlight);

      container.addEventListener("click", function (event) {
        if (mode !== "erase") return;
        var mark = event.target.closest(".ege-highlight");
        if (!mark || !container.contains(mark)) return;
        event.preventDefault();
        unwrapHighlight(mark);
        persistContainer(container);
      });
    });

    tools.appendChild(highlightBtn);
    tools.appendChild(eraseBtn);
    tools.appendChild(clearBtn);

    return tools;
  }

  function attachAll(panel, topicId, taskId) {
    if (!panel) return;

    var existing = panel.querySelector(".ege-highlight-tools");
    if (existing) existing.remove();

    var task = panel.querySelector(".ege-task");
    if (!task) return;

    var base = topicId + "_" + taskId;
    var savedAll = loadAll();
    var containers = [];

    task.querySelectorAll(".ege-passage, .ege-text-block").forEach(function (el, index) {
      var id = base + "_h" + index;
      var hasInteractiveGaps = !!el.querySelector(".ege-gap-insert");
      var saved = savedAll[id];
      var savedHasGaps = !!(saved && saved.indexOf("ege-gap-insert") !== -1);

      /* Skip incompatible highlight saves that would wipe gap-insert shells */
      if (saved && (!hasInteractiveGaps || savedHasGaps)) {
        el.innerHTML = saved;
        el.querySelectorAll(".ege-gap-insert").forEach(function (insert) {
          insert.classList.remove("is-filled", "is-correct", "is-wrong");
          var text = insert.querySelector(".ege-gap-insert__text");
          if (text) text.textContent = "";
          else {
            var span = document.createElement("span");
            span.className = "ege-gap-insert__text";
            insert.appendChild(span);
          }
        });
      }

      el.classList.add("ege-highlightable");
      el.dataset.highlightId = id;
      containers.push(el);
    });

    if (!containers.length) return;

    var tools = buildTaskToolbar(containers);
    panel.insertBefore(tools, task);
  }

  window.EgeHighlight = {
    attachAll: attachAll,
  };
})();

  </script>
  <script>

(function () {
  "use strict";

  var STORAGE_KEY = "ege-prep.scores.v1";
  var TOPIC_ID = "vocabulary-cloze";

  function taskMaxScore(task) {
    return task.questions.length;
  }

  function findTask(taskId) {
    if (!state.topic) return null;
    return state.topic.tasks.find(function (item) {
      return item.id === taskId;
    });
  }

  function taskPrefix(taskId) {
    return state.topicId + "_" + taskId;
  }

  function vocabGapNum(question) {
    return String(parseInt(question.q, 10));
  }

  function buildTaskArticle(task) {
    var wrap = document.createElement("article");
    wrap.className = "ege-task ege-task--panels";
    wrap.id = "task-" + task.id;
    wrap.dataset.taskId = task.id;
    return wrap;
  }

  function replaceGapPlaceholders(root, entries) {
    var inserts = {};
    entries.forEach(function (entry) {
      var placeholder = root.querySelector(entry.selector);
      if (!placeholder) return;

      var insert = document.createElement("span");
      insert.className = "ege-gap-insert";
      insert.dataset.gap = entry.gapId;

      var textSpan = document.createElement("span");
      textSpan.className = "ege-gap-insert__text";
      insert.appendChild(textSpan);
      placeholder.replaceWith(insert);
      inserts[entry.gapId] = insert;
    });
    return inserts;
  }

  function setRadioValue(name, value) {
    document.querySelectorAll('input[name="' + name + '"]').forEach(function (radio) {
      radio.checked = radio.value === String(value);
    });
  }

  function getCheckedValue(name) {
    var checked = document.querySelector('input[name="' + name + '"]:checked');
    return checked ? checked.value : "";
  }

  function clearChoiceGroup(name) {
    document.querySelectorAll('input[name="' + name + '"]').forEach(function (radio) {
      radio.checked = false;
      var pill = radio.closest(".ege-pill");
      if (pill) pill.classList.remove("is-correct", "is-wrong");
    });
  }

  function gradeMcQuestion(name, correctVal) {
    var checked = document.querySelector('input[name="' + name + '"]:checked');
    var value = checked ? checked.value : "";

    document.querySelectorAll('input[name="' + name + '"]').forEach(function (radio) {
      var pill = radio.closest(".ege-pill");
      if (pill) pill.classList.remove("is-correct", "is-wrong");
    });

    if (checked) {
      if (value === correctVal) {
        checked.closest(".ege-pill").classList.add("is-correct");
        return true;
      }
      checked.closest(".ege-pill").classList.add("is-wrong");
    }

    var correctRadio = document.querySelector(
      'input[name="' + name + '"][value="' + correctVal + '"]'
    );
    if (correctRadio) correctRadio.closest(".ege-pill").classList.add("is-correct");
    return false;
  }

  function getGapInsert(taskId, gapId) {
    return document.querySelector(
      "#task-" + taskId + ' .ege-gap-insert[data-gap="' + String(gapId) + '"]'
    );
  }

  function markGapInsert(taskId, gapId, ok, hasValue) {
    var insert = getGapInsert(taskId, gapId);
    if (!insert) return;
    insert.classList.toggle("is-correct", ok);
    insert.classList.toggle("is-wrong", hasValue && !ok);
  }

  function showScoreFeedback(taskId, correct, max, options) {
    var scoreEl = document.getElementById("score-" + taskId);
    if (!scoreEl) return;
    var task = findTask(taskId);
    var revealKey = options && options.revealKey;
    var lines = [
      "Score: " + correct + " / " + max + (correct === max ? ". All correct." : ""),
    ];
    var detail = buildGapScoreLines(taskId, task, { revealKey: revealKey || correct === max });
    if (detail.length) lines = lines.concat(detail);
    scoreEl.hidden = false;
    scoreEl.textContent = lines.join("\n");
    scoreEl.className =
      "ege-task__score " + (correct === max ? "is-good" : correct === 0 ? "is-bad" : "is-mixed");
  }

  function hideScoreFeedback(taskId) {
    var scoreEl = document.getElementById("score-" + taskId);
    if (!scoreEl) return;
    scoreEl.hidden = true;
    scoreEl.textContent = "";
  }

  function buildGapScoreLines(taskId, task, opts) {
    var lines = [];
    if (!task || !task.questions) return lines;
    var revealKey = opts && opts.revealKey;
    var prefix = taskPrefix(taskId);
    task.questions.forEach(function (question, index) {
      var gap = vocabGapNum(question);
      var value = getCheckedValue(prefix + "_q_" + index);
      var picked = value ? question.opts[parseInt(value, 10) - 1] || "—" : "—";
      var answer = question.opts[question.correct] || "";
      var ok = value && value === String(question.correct + 1);
      if (ok) {
        lines.push(gap + ": " + picked + " ✓");
      } else if (revealKey) {
        lines.push(gap + ": " + picked + " → " + answer);
      } else {
        lines.push(gap + ": " + picked + " ✗");
      }
    });
    return lines;
  }

  function buildAnswerStrings(taskId, task) {
    var yourAnswers = "";
    var correctAnswers = "";
    if (!task || !task.questions) return { yourAnswers: yourAnswers, correctAnswers: correctAnswers };

    var prefix = taskPrefix(taskId);
    task.questions.forEach(function (question, index) {
      var value = getCheckedValue(prefix + "_q_" + index);
      yourAnswers += value || "–";
      correctAnswers += String(question.correct + 1);
    });
    return { yourAnswers: yourAnswers, correctAnswers: correctAnswers };
  }

  function allGapsFilled(taskId) {
    var task = findTask(taskId);
    if (!task || !task.questions) return false;
    var prefix = taskPrefix(taskId);
    return task.questions.every(function (_question, index) {
      return !!getCheckedValue(prefix + "_q_" + index);
    });
  }

  function syncCheckEnabled(taskId) {
    var checkBtn = document.getElementById("check-" + taskId);
    if (!checkBtn || checkBtn.hidden) return;
    var ready = allGapsFilled(taskId);
    checkBtn.disabled = !ready;
    checkBtn.title = ready ? "" : "Fill all gaps first";
  }

  function loadScores(topicId) {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      var all = JSON.parse(raw);
      return all[topicId] || {};
    } catch (_err) {
      return {};
    }
  }

  function saveScore(topicId, taskId, score, max) {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var all = raw ? JSON.parse(raw) : {};
      if (!all[topicId]) all[topicId] = {};
      all[topicId][taskId] = { score: score, max: max, at: Date.now() };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    } catch (_err) {
      /* ignore quota errors */
    }
  }

  function clearScore(topicId, taskId) {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var all = JSON.parse(raw);
      if (all[topicId]) {
        delete all[topicId][taskId];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
      }
    } catch (_err) {
      /* ignore */
    }
  }

  function optionRange(count) {
    var items = [];
    for (var i = 1; i <= count; i += 1) items.push(i);
    return items;
  }

  function buildChoiceGroup(name, count, opts) {
    opts = opts || {};
    var group = document.createElement("div");
    group.className = "ege-choice-group";
    group.setAttribute("role", "radiogroup");
    if (opts.label) group.setAttribute("aria-label", opts.label);

    optionRange(count).forEach(function (num) {
      var label = document.createElement("label");
      label.className = "ege-pill" + (opts.text ? " ege-pill--text" : "");
      var input = document.createElement("input");
      input.type = "radio";
      input.name = name;
      input.value = String(num);
      label.appendChild(input);
      label.appendChild(document.createTextNode(String(num)));
      group.appendChild(label);
    });

    return group;
  }


  function buildPanel(label, content, extraClass) {
    var panel = document.createElement("div");
    panel.className = "ege-panel" + (extraClass ? " " + extraClass : "");

    var labelEl = document.createElement("p");
    labelEl.className = "ege-panel__label";
    labelEl.textContent = label;
    panel.appendChild(labelEl);
    panel.appendChild(content);
    return panel;
  }

  function buildSplit(readEl, workEl, modifier) {
    var split = document.createElement("div");
    split.className = "ege-split" + (modifier ? " " + modifier : "");

    var read = document.createElement("div");
    read.className = "ege-split__read";
    read.appendChild(readEl);

    var work = document.createElement("div");
    work.className = "ege-split__work";
    work.appendChild(workEl);

    split.appendChild(read);
    split.appendChild(work);
    return split;
  }

  function markChoiceGroup(name, value, correctValue, revealCorrect) {
    var pills = [];
    document.querySelectorAll('input[name="' + name + '"]').forEach(function (radio) {
      var pill = radio.closest(".ege-pill");
      if (pill) {
        pill.classList.remove("is-correct", "is-wrong");
        pills.push({ pill: pill, value: radio.value, checked: radio.checked });
      }
    });

    var ok = value === String(correctValue);
    pills.forEach(function (item) {
      if (item.checked) {
        item.pill.classList.add(ok ? "is-correct" : "is-wrong");
      } else if (revealCorrect && !ok && item.value === String(correctValue)) {
        item.pill.classList.add("is-correct");
      }
    });
    return ok;
  }

  function buildVocabBoard(task, topicId, inserts) {
    var prefix = topicId + "_" + task.id;
    var board = document.createElement("div");
    board.className = "ege-sidebar-work ege-vocab-picks";
    board.setAttribute("aria-label", "Choose a word for the selected gap");

    var hidden = document.createElement("div");
    hidden.className = "ege-match-hidden";

    var wordsRow = document.createElement("div");
    wordsRow.className = "ege-match-words";

    var activeIndex = 0;

    function radioName(index) {
      return prefix + "_q_" + index;
    }

    function gapAt(index) {
      return vocabGapNum(task.questions[index]);
    }

    function updateInsert(index, num) {
      var gap = gapAt(index);
      var insert = getGapInsert(task.id, gap) || inserts[gap];
      if (!insert || !insert.isConnected) return;
      inserts[gap] = insert;
      var textSpan = insert.querySelector(".ege-gap-insert__text");
      if (!textSpan) {
        textSpan = document.createElement("span");
        textSpan.className = "ege-gap-insert__text";
        insert.appendChild(textSpan);
      }
      if (num) {
        textSpan.textContent = task.questions[index].opts[parseInt(num, 10) - 1] || "";
        insert.classList.add("is-filled");
        insert.classList.remove("is-empty");
      } else {
        textSpan.textContent = "";
        insert.classList.remove("is-filled", "is-empty", "is-just-filled");
      }
    }

    function flashFilledGap(index) {
      var insert = getGapInsert(task.id, gapAt(index)) || inserts[gapAt(index)];
      if (!insert) return;
      insert.classList.remove("is-just-filled");
      void insert.offsetWidth;
      insert.classList.add("is-just-filled");
      window.setTimeout(function () {
        insert.classList.remove("is-just-filled");
      }, 560);
    }

    function setHoverMatch(on) {
      if (activeIndex < 0) return;
      var insert = getGapInsert(task.id, gapAt(activeIndex)) || inserts[gapAt(activeIndex)];
      if (!insert) return;
      insert.classList.toggle("is-hover-match", !!on);
    }

    function suppressStickyHover() {
      board.classList.add("is-suppress-hover");
      function release() {
        board.classList.remove("is-suppress-hover");
        document.removeEventListener("pointermove", release, true);
        document.removeEventListener("pointerdown", release, true);
      }
      document.addEventListener("pointermove", release, true);
      document.addEventListener("pointerdown", release, true);
    }

    function clearWordListHighlight() {
      wordsRow.querySelectorAll(".ege-match-pill--word").forEach(function (btn) {
        btn.classList.remove("is-selected", "is-correct", "is-wrong");
        btn.blur();
      });
      if (document.activeElement && wordsRow.contains(document.activeElement)) {
        document.activeElement.blur();
      }
    }

    function syncActiveGaps() {
      task.questions.forEach(function (_question, index) {
        var insert = getGapInsert(task.id, gapAt(index)) || inserts[gapAt(index)];
        if (insert) insert.classList.toggle("is-active-gap", index === activeIndex);
      });
    }

    function syncWordsRow() {
      if (activeIndex < 0 || !task.questions[activeIndex]) {
        clearWordListHighlight();
        return;
      }
      var question = task.questions[activeIndex];
      var value = getCheckedValue(radioName(activeIndex));
      wordsRow.querySelectorAll(".ege-match-pill--word").forEach(function (btn) {
        btn.classList.toggle("is-selected", !!value && btn.dataset.value === value);
        btn.classList.remove("is-correct", "is-wrong");
      });
      /* rebuild if option set changed (per gap) */
      var same =
        wordsRow.children.length === question.opts.length &&
        Array.prototype.every.call(wordsRow.children, function (btn, i) {
          return btn.dataset.word === question.opts[i];
        });
      if (!same) renderWordsRow();
      else {
        wordsRow.querySelectorAll(".ege-match-pill--word").forEach(function (btn) {
          btn.classList.toggle("is-selected", !!value && btn.dataset.value === value);
        });
      }
    }

    function renderWordsRow() {
      var question = activeIndex >= 0 ? task.questions[activeIndex] : null;
      var value =
        activeIndex >= 0 ? getCheckedValue(radioName(activeIndex)) : "";
      wordsRow.textContent = "";
      if (!question) return;
      question.opts.forEach(function (opt, optIndex) {
        var num = optIndex + 1;
        var wordBtn = document.createElement("button");
        wordBtn.type = "button";
        wordBtn.className = "ege-match-pill ege-match-pill--word";
        wordBtn.dataset.value = String(num);
        wordBtn.dataset.word = opt;
        var n = document.createElement("span");
        n.className = "ege-vocab-word__n";
        n.textContent = num + ".";
        wordBtn.appendChild(n);
        wordBtn.appendChild(document.createTextNode(opt));
        if (value && value === String(num)) wordBtn.classList.add("is-selected");
        wordBtn.addEventListener("click", function () {
          assignWord(num);
        });
        wordBtn.addEventListener("mouseenter", function () {
          setHoverMatch(true);
        });
        wordBtn.addEventListener("mouseleave", function () {
          setHoverMatch(false);
        });
        wordsRow.appendChild(wordBtn);
      });
    }

    function nextEmptyIndex(fromIndex) {
      var start = fromIndex == null ? 0 : fromIndex + 1;
      for (var i = start; i < task.questions.length; i += 1) {
        if (!getCheckedValue(radioName(i))) return i;
      }
      for (var j = 0; j < start; j += 1) {
        if (!getCheckedValue(radioName(j))) return j;
      }
      return fromIndex;
    }

    function clearGapMarks(index) {
      var gap = gapAt(index);
      var insert = getGapInsert(task.id, gap) || inserts[gap];
      if (insert) insert.classList.remove("is-correct", "is-wrong");
      wordsRow.querySelectorAll(".ege-match-pill--word").forEach(function (btn) {
        btn.classList.remove("is-correct", "is-wrong");
      });
    }

    function clearIndex(index) {
      var insert = getGapInsert(task.id, gapAt(index)) || inserts[gapAt(index)];
      if (insert && insert.classList.contains("is-locked")) return;
      clearChoiceGroup(radioName(index));
      updateInsert(index, null);
      clearGapMarks(index);
      if (insert) insert.classList.remove("is-correct", "is-wrong", "is-locked");
      if (index === activeIndex) syncWordsRow();
      syncCheckEnabled(task.id);
    }

    function assignWord(num) {
      var insert = getGapInsert(task.id, gapAt(activeIndex)) || inserts[gapAt(activeIndex)];
      if (insert && insert.classList.contains("is-locked")) return;

      var current = getCheckedValue(radioName(activeIndex));
      if (current === String(num)) {
        clearChoiceGroup(radioName(activeIndex));
        updateInsert(activeIndex, null);
        clearGapMarks(activeIndex);
        syncWordsRow();
        syncCheckEnabled(task.id);
        return;
      }
      var filledIndex = activeIndex;
      setRadioValue(radioName(activeIndex), num);
      updateInsert(activeIndex, String(num));
      clearGapMarks(activeIndex);
      flashFilledGap(filledIndex);
      setHoverMatch(false);

      var next = nextEmptyIndex(activeIndex);
      setActiveIndex(next);

      /* Commit clears list highlight — selected style returns only if you re-open a filled gap */
      clearWordListHighlight();
      suppressStickyHover();
      syncCheckEnabled(task.id);
    }

    function setActiveIndex(index) {
      if (index == null || index < 0 || index >= task.questions.length) return;
      setHoverMatch(false);
      activeIndex = index;
      syncActiveGaps();
      renderWordsRow();
    }

    function bindGapInsert(index) {
      var gap = gapAt(index);
      var insert = getGapInsert(task.id, gap) || inserts[gap];
      if (!insert || insert.dataset.boundSelect === "1") return;
      insert.dataset.boundSelect = "1";
      insert.setAttribute("role", "button");
      insert.setAttribute("aria-label", "Select gap " + gap);
      insert.tabIndex = 0;
      insert.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        setActiveIndex(index);
      });
      insert.addEventListener("keydown", function (event) {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        setActiveIndex(index);
      });
    }

    task.questions.forEach(function (question, index) {
      hidden.appendChild(
        buildChoiceGroup(radioName(index), question.opts.length, {
          label: "Word for gap " + vocabGapNum(question),
        })
      );
      bindGapInsert(index);
    });

    board.appendChild(wordsRow);
    board.appendChild(hidden);
    board.setActiveIndex = setActiveIndex;
    board.assignWord = assignWord;
    board.syncWordsRow = syncWordsRow;
    board.updateInsert = updateInsert;
    board.clearIndex = clearIndex;
    board.getActiveIndex = function () {
      return activeIndex;
    };
    board.inserts = inserts;

    setActiveIndex(0);
    syncCheckEnabled(task.id);
    return board;
  }

  function buildTaskFooter(taskId, max) {
    var footer = document.createElement("div");
    footer.className = "ege-task__footer";

    var actions = document.createElement("div");
    actions.className = "ege-task__actions";

    var checkBtn = document.createElement("button");
    checkBtn.type = "button";
    checkBtn.className = "ege-btn ege-btn--primary";
    checkBtn.id = "check-" + taskId;
    checkBtn.textContent = "Check answers";
    checkBtn.disabled = true;
    checkBtn.title = "Fill all gaps first";
    checkBtn.addEventListener("click", function () {
      checkTask(taskId);
    });

    var tryBtn = document.createElement("button");
    tryBtn.type = "button";
    tryBtn.className = "ege-btn ege-btn--primary";
    tryBtn.id = "try-" + taskId;
    tryBtn.textContent = "Try again";
    tryBtn.hidden = true;
    tryBtn.addEventListener("click", function () {
      tryAgainTask(taskId);
    });

    var showBtn = document.createElement("button");
    showBtn.type = "button";
    showBtn.className = "ege-btn ege-btn--ghost";
    showBtn.id = "show-" + taskId;
    showBtn.textContent = "Show answers";
    showBtn.hidden = true;
    showBtn.addEventListener("click", function () {
      revealTask(taskId);
    });

    var resetBtn = document.createElement("button");
    resetBtn.type = "button";
    resetBtn.className = "ege-btn ege-btn--ghost";
    resetBtn.textContent = "Reset";
    resetBtn.addEventListener("click", function () {
      resetTask(taskId);
    });

    actions.appendChild(checkBtn);
    actions.appendChild(tryBtn);
    actions.appendChild(showBtn);
    actions.appendChild(resetBtn);

    var score = document.createElement("p");
    score.className = "ege-task__score";
    score.id = "score-" + taskId;
    score.hidden = true;
    score.setAttribute("aria-live", "polite");

    footer.appendChild(actions);
    footer.appendChild(score);
    footer.dataset.max = String(max);
    return footer;
  }

  function renderVocabCloze(task, topicId) {
    var max = taskMaxScore(task);
    var wrap = buildTaskArticle(task);

    var htmlPass = task.passage;
    task.questions.forEach(function (question) {
      var gapNum = vocabGapNum(question);
      htmlPass = htmlPass.split("[" + gapNum + "]").join('<span data-vocab-gap="' + gapNum + '"></span>');
    });

    var passage = document.createElement("div");
    passage.className = "ege-passage ege-gapfill-passage";
    passage.innerHTML = htmlPass;

    var inserts = replaceGapPlaceholders(
      passage,
      task.questions.map(function (question) {
        var gapNum = vocabGapNum(question);
        return { selector: '[data-vocab-gap="' + gapNum + '"]', gapId: gapNum };
      })
    );

    var board = buildVocabBoard(task, topicId, inserts);

    wrap.appendChild(
      buildSplit(
        buildPanel("Text", passage, "ege-panel--read"),
        buildPanel("Words", board, "ege-panel--work"),
        "ege-split--panels"
      )
    );
    wrap.appendChild(buildTaskFooter(task.id, max));
    return wrap;
  }

  var state = {
    topic: null,
    topicId: "",
    scores: {},
    activeTaskId: null,
  };

  function setNavStatus(taskId, score, max) {
    var btn = document.getElementById("nav-" + taskId);
    if (!btn) return;
    btn.classList.remove("is-perfect", "is-partial", "is-empty");
    if (score === max && max > 0) btn.classList.add("is-perfect");
    else if (score > 0) btn.classList.add("is-partial");
    else btn.classList.add("is-empty");
    btn.setAttribute("aria-label", btn.textContent + ": " + score + " of " + max);
  }

  function setNavOpen(open) {
    var page = document.getElementById("egePage");
    var currentBtn = document.getElementById("egeMobileCurrent");
    if (page) page.classList.toggle("is-nav-open", open);
    if (currentBtn) currentBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  function showTask(taskId) {
    state.activeTaskId = taskId;
    document.querySelectorAll(".ege-task-panel").forEach(function (panel) {
      panel.hidden = panel.dataset.taskId !== taskId;
    });
    document.querySelectorAll(".ege-nav__btn").forEach(function (btn) {
      btn.classList.toggle("is-active", btn.dataset.taskId === taskId);
    });

    var task = findTask(taskId);
    var currentBtn = document.getElementById("egeMobileCurrent");
    if (currentBtn && task) currentBtn.textContent = task.nav;

    var instructions = document.getElementById("egeInstructions");
    if (instructions) {
      instructions.textContent =
        (state.topic && (state.topic.instructions || state.topic.subtitle)) ||
        "";
    }
    syncCheckEnabled(taskId);
  }

  function showAdjacentTask(delta) {
    if (!state.topic) return;
    var ids = state.topic.tasks.map(function (t) { return t.id; });
    var idx = ids.indexOf(state.activeTaskId);
    if (idx < 0) return;
    var next = idx + delta;
    if (next < 0 || next >= ids.length) return;
    setNavOpen(false);
    showTask(ids[next]);
  }

  function clearEmptyHighlights(taskId, task) {
    if (!task || !task.questions) return;
    task.questions.forEach(function (question) {
      var insert = getGapInsert(taskId, vocabGapNum(question));
      if (insert) insert.classList.remove("is-empty");
    });
  }

  function highlightEmptyGaps(taskId, task) {
    if (!task || !task.questions) return;
    var prefix = taskPrefix(taskId);
    task.questions.forEach(function (question, index) {
      var empty = !getCheckedValue(prefix + "_q_" + index);
      var insert = getGapInsert(taskId, vocabGapNum(question));
      if (insert) insert.classList.toggle("is-empty", empty);
    });
  }

  function shakeWordsPanel(taskId) {
    var board = document.querySelector("#task-" + taskId + " .ege-vocab-picks");
    if (!board) return;
    board.classList.remove("is-shake");
    void board.offsetWidth;
    board.classList.add("is-shake");
    function onEnd() {
      board.classList.remove("is-shake");
      board.removeEventListener("animationend", onEnd);
    }
    board.addEventListener("animationend", onEnd);
  }

  function setTaskSuccess(taskId, on) {
    var taskEl = document.getElementById("task-" + taskId);
    if (taskEl) taskEl.classList.toggle("is-all-correct", !!on);
  }

  function setShowAnswersVisible(taskId, visible) {
    var showBtn = document.getElementById("show-" + taskId);
    if (showBtn) showBtn.hidden = !visible;
  }

  function setTryAgainVisible(taskId, visible) {
    var tryBtn = document.getElementById("try-" + taskId);
    if (tryBtn) tryBtn.hidden = !visible;
  }

  function setCheckVisible(taskId, visible) {
    var checkBtn = document.getElementById("check-" + taskId);
    if (!checkBtn) return;
    checkBtn.hidden = !visible;
    if (visible) syncCheckEnabled(taskId);
  }

  /** Footer modes so we never show Check + Try again + Reveal + Reset together. */
  function setFooterMode(taskId, mode) {
    if (mode === "mistakes") {
      setCheckVisible(taskId, false);
      setTryAgainVisible(taskId, true);
      setShowAnswersVisible(taskId, true);
      return;
    }
    if (mode === "retrying") {
      setCheckVisible(taskId, true);
      setTryAgainVisible(taskId, false);
      setShowAnswersVisible(taskId, true);
      return;
    }
    if (mode === "revealed") {
      setCheckVisible(taskId, false);
      setTryAgainVisible(taskId, false);
      setShowAnswersVisible(taskId, false);
      return;
    }
    /* work | perfect */
    setCheckVisible(taskId, true);
    setTryAgainVisible(taskId, false);
    setShowAnswersVisible(taskId, false);
  }

  function lockCorrectGaps(taskId, task) {
    var prefix = taskPrefix(taskId);
    task.questions.forEach(function (question, index) {
      var value = getCheckedValue(prefix + "_q_" + index);
      if (!value || value !== String(question.correct + 1)) return;
      var insert = getGapInsert(taskId, vocabGapNum(question));
      if (!insert) return;
      insert.classList.add("is-locked", "is-correct");
      insert.classList.remove("is-wrong");
      insert.setAttribute("aria-disabled", "true");
      insert.tabIndex = -1;
    });
  }

  function unlockAllGaps(taskId, task) {
    task.questions.forEach(function (question) {
      var insert = getGapInsert(taskId, vocabGapNum(question));
      if (!insert) return;
      insert.classList.remove("is-locked");
      insert.removeAttribute("aria-disabled");
      insert.tabIndex = 0;
    });
  }

  function checkTask(taskId) {
    var task = findTask(taskId);
    if (!task) return;

    if (!allGapsFilled(taskId)) {
      var scoreEl = document.getElementById("score-" + taskId);
      if (scoreEl) {
        scoreEl.hidden = false;
        scoreEl.textContent = "Fill all gaps before checking.";
        scoreEl.className = "ege-task__score is-bad";
      }
      highlightEmptyGaps(taskId, task);
      shakeWordsPanel(taskId);
      setTaskSuccess(taskId, false);
      syncCheckEnabled(taskId);
      return;
    }

    clearEmptyHighlights(taskId, task);

    var correct = 0;
    var max = taskMaxScore(task);
    var board = document.querySelector("#task-" + taskId + " .ege-vocab-picks");
    var wrongIndexes = [];
    var prefix = taskPrefix(taskId);

    task.questions.forEach(function (question, index) {
      var name = prefix + "_q_" + index;
      var value = getCheckedValue(name);
      var gapNum = vocabGapNum(question);
      var ok = markChoiceGroup(name, value, question.correct + 1, false);
      if (ok) correct += 1;
      else wrongIndexes.push(index);
      markGapInsert(taskId, gapNum, ok, !!value);
    });

    lockCorrectGaps(taskId, task);

    if (board && board.syncWordsRow) board.syncWordsRow();
    if (board) {
      var active = board.getActiveIndex ? board.getActiveIndex() : 0;
      var name = prefix + "_q_" + active;
      var checked = document.querySelector('input[name="' + name + '"]:checked');
      if (checked) {
        var pill = checked.closest(".ege-pill");
        var wordBtn = board.querySelector(
          '.ege-match-pill--word[data-value="' + checked.value + '"]'
        );
        if (wordBtn && pill) {
          if (pill.classList.contains("is-correct")) wordBtn.classList.add("is-correct");
          if (pill.classList.contains("is-wrong")) wordBtn.classList.add("is-wrong");
        }
      }
    }

    state.scores[taskId] = correct;
    saveScore(state.topicId, taskId, correct, max);
    setNavStatus(taskId, correct, max);
    showScoreFeedback(taskId, correct, max, { revealKey: false });
    setTaskSuccess(taskId, correct === max);

    if (wrongIndexes.length > 0) {
      setFooterMode(taskId, "mistakes");
    } else {
      setFooterMode(taskId, "perfect");
    }
  }

  function tryAgainTask(taskId) {
    var task = findTask(taskId);
    if (!task) return;

    var prefix = taskPrefix(taskId);
    var board = document.querySelector("#task-" + taskId + " .ege-vocab-picks");
    var firstWrong = null;

    task.questions.forEach(function (question, index) {
      var name = prefix + "_q_" + index;
      var value = getCheckedValue(name);
      if (value && value === String(question.correct + 1)) return;

      if (firstWrong == null) firstWrong = index;
      if (board && board.clearIndex) {
        board.clearIndex(index);
      } else {
        clearChoiceGroup(name);
        var insert = getGapInsert(taskId, vocabGapNum(question));
        if (insert) {
          insert.classList.remove(
            "is-correct",
            "is-wrong",
            "is-filled",
            "is-locked",
            "is-empty",
            "is-just-filled"
          );
          insert.removeAttribute("aria-disabled");
          insert.tabIndex = 0;
          var textSpan = insert.querySelector(".ege-gap-insert__text");
          if (textSpan) textSpan.textContent = "";
        }
      }
    });

    if (board && board.setActiveIndex) {
      board.setActiveIndex(firstWrong != null ? firstWrong : 0);
    } else if (board && board.syncWordsRow) {
      board.syncWordsRow();
    }

    hideScoreFeedback(taskId);
    setTaskSuccess(taskId, false);
    setFooterMode(taskId, "retrying");
    syncCheckEnabled(taskId);
  }

  function revealTask(taskId) {
    var task = findTask(taskId);
    if (!task) return;

    var prefix = taskPrefix(taskId);
    var board = document.querySelector("#task-" + taskId + " .ege-vocab-picks");
    var snapshot = buildAnswerStrings(taskId, task);
    var max = taskMaxScore(task);
    var earned = 0;

    task.questions.forEach(function (question, index) {
      var value = getCheckedValue(prefix + "_q_" + index);
      if (value && value === String(question.correct + 1)) earned += 1;
    });

    unlockAllGaps(taskId, task);

    task.questions.forEach(function (question, index) {
      var answer = String(question.correct + 1);
      setRadioValue(prefix + "_q_" + index, answer);
      if (board && board.updateInsert) board.updateInsert(index, answer);
      markGapInsert(taskId, vocabGapNum(question), true, true);
      markChoiceGroup(prefix + "_q_" + index, answer, answer, true);
    });

    lockCorrectGaps(taskId, task);
    if (board && board.syncWordsRow) board.syncWordsRow();

    state.scores[taskId] = earned;
    saveScore(state.topicId, taskId, earned, max);
    setNavStatus(taskId, earned, max);
    showScoreFeedback(taskId, earned, max, {
      revealKey: true,
      yourAnswers: snapshot.yourAnswers,
      correctAnswers: snapshot.correctAnswers,
    });
    setTaskSuccess(taskId, true);
    setFooterMode(taskId, "revealed");
  }

  function resetTask(taskId) {
    var task = findTask(taskId);
    if (!task) return;

    var prefix = taskPrefix(taskId);
    var board = document.querySelector("#task-" + taskId + " .ege-vocab-picks");

    unlockAllGaps(taskId, task);

    task.questions.forEach(function (question, index) {
      clearChoiceGroup(prefix + "_q_" + index);
      var gapNum = vocabGapNum(question);
      var insert = document.querySelector(
        "#task-" + taskId + ' .ege-gap-insert[data-gap="' + gapNum + '"]'
      );
      if (insert) {
        insert.classList.remove(
          "is-correct",
          "is-wrong",
          "is-filled",
          "is-active-gap",
          "is-empty",
          "is-just-filled",
          "is-hover-match",
          "is-locked"
        );
        insert.removeAttribute("aria-disabled");
        insert.tabIndex = 0;
        var textSpan = insert.querySelector(".ege-gap-insert__text");
        if (textSpan) textSpan.textContent = "";
      }
    });

    if (board && board.setActiveIndex) board.setActiveIndex(0);
    else if (board && board.syncWordsRow) board.syncWordsRow();

    state.scores[taskId] = 0;
    clearScore(state.topicId, taskId);
    setNavStatus(taskId, 0, taskMaxScore(task));
    hideScoreFeedback(taskId);
    setTaskSuccess(taskId, false);
    setFooterMode(taskId, "work");
    syncCheckEnabled(taskId);
  }

  function mountTopic(topic, topicId) {
    state.topic = topic;
    state.topicId = topicId;
    state.scores = {};

    var saved = loadScores(topicId);
    topic.tasks.forEach(function (task) {
      state.scores[task.id] = saved[task.id] ? saved[task.id].score : 0;
    });

    document.title = topic.title + " – ЕГЭ Prep – Yap O'Clock";
    var titleEl = document.getElementById("egeTopicTitleText") || document.getElementById("egeTopicTitle");
    if (titleEl) titleEl.textContent = topic.title;
    var instructionsEl = document.getElementById("egeInstructions");
    if (instructionsEl) {
      instructionsEl.textContent = topic.instructions || topic.subtitle || "";
    }

    var nav = document.getElementById("egeNav");
    var panels = document.getElementById("egePanels");
    nav.textContent = "";
    panels.textContent = "";

    topic.tasks.forEach(function (task, index) {
      var max = taskMaxScore(task);
      var savedScore = state.scores[task.id] || 0;

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ege-nav__btn";
      btn.id = "nav-" + task.id;
      btn.dataset.taskId = task.id;
      btn.textContent = task.nav;
      btn.addEventListener("click", function () {
        setNavOpen(false);
        showTask(task.id);
      });
      nav.appendChild(btn);
      setNavStatus(task.id, savedScore, max);

      var shell = document.createElement("section");
      shell.className = "ege-task-panel";
      shell.id = "panel-" + task.id;
      shell.dataset.taskId = task.id;
      shell.hidden = index !== 0;

      shell.appendChild(renderVocabCloze(task, topicId));
      if (window.EgeHighlight) {
        EgeHighlight.attachAll(shell, topicId, task.id);
      }
      panels.appendChild(shell);
    });

    showTask(topic.tasks[0].id);
    bindMobileSwitch();
  }

  function bindMobileSwitch() {
    var currentBtn = document.getElementById("egeMobileCurrent");
    var prevBtn = document.getElementById("egePrevTask");
    var nextBtn = document.getElementById("egeNextTask");
    if (currentBtn && !currentBtn.dataset.bound) {
      currentBtn.dataset.bound = "1";
      currentBtn.addEventListener("click", function () {
        var page = document.getElementById("egePage");
        setNavOpen(!(page && page.classList.contains("is-nav-open")));
      });
    }
    if (prevBtn && !prevBtn.dataset.bound) {
      prevBtn.dataset.bound = "1";
      prevBtn.addEventListener("click", function () {
        showAdjacentTask(-1);
      });
    }
    if (nextBtn && !nextBtn.dataset.bound) {
      nextBtn.dataset.bound = "1";
      nextBtn.addEventListener("click", function () {
        showAdjacentTask(1);
      });
    }
  }

  function isTypingTarget(el) {
    if (!el || el === document.body) return false;
    var tag = el.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
    if (el.isContentEditable) return true;
    return false;
  }

  function handleTaskShortcuts(event) {
    if (event.defaultPrevented) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.repeat) return;
    if (isTypingTarget(event.target)) return;

    var taskId = state.activeTaskId;
    if (!taskId) return;
    var task = findTask(taskId);
    if (!task) return;
    var board = document.querySelector("#task-" + taskId + " .ege-vocab-picks");
    if (!board) return;

    var key = event.key;
    var code = event.code;

    var num = null;
    if (/^[1-4]$/.test(key)) num = parseInt(key, 10);
    else if (/^Digit[1-4]$/.test(code) || /^Numpad[1-4]$/.test(code)) {
      num = parseInt(code.replace(/\D/g, ""), 10);
    }
    if (num != null && board.assignWord) {
      var active = board.getActiveIndex ? board.getActiveIndex() : 0;
      var question = task.questions[active];
      if (question && num <= question.opts.length) {
        event.preventDefault();
        board.assignWord(num);
      }
    }
  }

  function init() {
    var topic = window.VOCAB_CLOZE_DATA;
    if (!topic || !topic.tasks || !topic.tasks.length) {
      var panels = document.getElementById("egePanels");
      if (panels) {
        panels.innerHTML = '<p class="ege-error">No vocabulary data embedded.</p>';
      }
      return;
    }
    mountTopic(topic, topic.id || TOPIC_ID);
    document.addEventListener("keydown", handleTaskShortcuts);
  }

  window.VocabClozeStandalone = { init: init };
})();


  </script>
